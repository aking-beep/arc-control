apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc-control-console
  namespace: arc-control
  labels:
    app.kubernetes.io/name: arc-control
    app.kubernetes.io/component: console
spec:
  # The console holds no state of its own — it reads everything through the
  # API with the operator credential — so it scales freely.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: arc-control
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arc-control
        app.kubernetes.io/component: console
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: ghcr.io/arc-transformation-group/arc-control:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["node", "apps/control-console/dist/main.js"]
          ports:
            - name: http
              containerPort: 8788
          env:
            - name: ARC_CONSOLE_HOST
              value: "0.0.0.0"
            - name: ARC_CONSOLE_PORT
              value: "8788"
            - name: ARC_API_BASE
              value: http://arc-control-api:8787
            - name: ARC_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: arc-control-operator
                  key: operator-token
            # v0.1 takes the operator identity from configuration rather than
            # from an authenticated session. Put an identity-aware proxy in
            # front of this Service — see docs/TRUST_MODEL.md.
            - name: ARC_OPERATOR_IDENTITY
              value: operator@cluster.local
            - name: ARC_OPERATOR_ROLES
              value: finance-manager,platform-oncall
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: arc-control-console
  namespace: arc-control
  labels:
    app.kubernetes.io/name: arc-control
    app.kubernetes.io/component: console
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arc-control
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: 8788
      targetPort: http
