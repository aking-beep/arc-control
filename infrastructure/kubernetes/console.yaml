apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc-control-console
  namespace: arc-control
  labels:
    app.kubernetes.io/name: arc-control
    app.kubernetes.io/component: console
spec:
  # The console holds no state of its own. It forwards the visitor's session
  # to the API, which holds the session server-side, so any replica can serve
  # any request and this scales freely.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: arc-control
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arc-control
        app.kubernetes.io/component: console
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: ghcr.io/arc-transformation-group/arc-control:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["node", "apps/control-console/dist/main.js"]
          ports:
            - name: http
              containerPort: 8788
          env:
            - name: ARC_CONSOLE_HOST
              value: "0.0.0.0"
            - name: ARC_CONSOLE_PORT
              value: "8788"
            # Where the console reaches the API: a ClusterIP Service, which
            # resolves inside the cluster and nowhere else.
            - name: ARC_API_BASE
              value: http://arc-control-api:8787
            # Where a browser reaches the API, for the sign-in redirect. Not
            # the same address as above, which is why this exists: send a
            # visitor to a ClusterIP name and you send them nowhere.
            - name: ARC_PUBLIC_API_BASE
              value: https://arc-control.example.com
            # Deliberately no operator credential. Under single sign-on the
            # console carries none: it forwards the visitor's session, asks the
            # API who that is, and shows that answer — so the name on an
            # approval is the one the API verified, never one configured here.
            #
            # For the shared-token fallback instead, set ARC_OPERATOR_TOKEN
            # from the secret along with ARC_OPERATOR_IDENTITY and
            # ARC_OPERATOR_ROLES, and read docs/TRUST_MODEL.md on what an
            # approval recorded that way can support.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: arc-control-console
  namespace: arc-control
  labels:
    app.kubernetes.io/name: arc-control
    app.kubernetes.io/component: console
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arc-control
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: 8788
      targetPort: http
