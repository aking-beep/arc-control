# Operator credentials.
#
# Committed as an example only — do not apply this file. Create the secret out
# of band, or point at whatever secret manager the cluster already uses:
#
#   kubectl -n arc-control create secret generic arc-control-operator \
#     --from-literal=session-secret="$(openssl rand -hex 32)" \
#     --from-literal=oidc-client-secret="<from your identity provider>" \
#     --from-literal=operator-token=""
#
# Two ways to authenticate an operator, and the choice decides what an
# approval record is worth:
#
#   session-secret + oidc-client-secret (with the ARC_OIDC_* values in
#     api.yaml) — operators sign in individually through your provider and
#     approvals are attributable to a person. ARC Control then refuses the
#     shared token outright, so this is not a door left ajar.
#
#   operator-token — one token for everyone, identity from a request header.
#     Anyone holding it can claim any identity, and every approval it records
#     says so: assurance `claimed`. A fallback for a deployment with no
#     provider yet, not a destination.
#
# With neither, the API still starts and still governs agents, but every
# operator endpoint refuses every request and nobody can administer the
# deployment.
apiVersion: v1
kind: Secret
metadata:
  name: arc-control-operator
  namespace: arc-control
type: Opaque
stringData:
  session-secret: "replace-me-do-not-apply-this-file"
  oidc-client-secret: "replace-me-do-not-apply-this-file"
  operator-token: ""
