# The operator token.
#
# Committed as an example only — do not apply this file. Generate a real token
# and create the secret out of band, or point at whatever secret manager the
# cluster already uses:
#
#   kubectl -n arc-control create secret generic arc-control-operator \
#     --from-literal=operator-token="$(openssl rand -hex 32)"
#
# Operator endpoints refuse every request when the token is unset, which is
# the correct default: an unauthenticated control plane is worse than none,
# because people believe it.
apiVersion: v1
kind: Secret
metadata:
  name: arc-control-operator
  namespace: arc-control
type: Opaque
stringData:
  operator-token: "replace-me-do-not-apply-this-file"
