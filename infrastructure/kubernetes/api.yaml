apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc-control-api
  namespace: arc-control
  labels:
    app.kubernetes.io/name: arc-control
    app.kubernetes.io/component: api
spec:
  # Exactly one. See storage.yaml: the v0.1 store is single-node, and a second
  # writer would fork the audit chain.
  replicas: 1
  strategy:
    # Recreate rather than RollingUpdate, so two pods never hold the same
    # ReadWriteOnce volume at once.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: arc-control
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arc-control
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/arc-transformation-group/arc-control:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["node", "apps/control-api/dist/main.js"]
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: ARC_HOST
              value: "0.0.0.0"
            - name: ARC_PORT
              value: "8787"
            - name: ARC_DATA_DIR
              value: /var/lib/arc-control
            - name: ARC_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: arc-control-operator
                  key: operator-token
          volumeMounts:
            - name: data
              mountPath: /var/lib/arc-control
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The process writes only to the data volume and to /tmp.
          # Everything else being read-only means a compromised connector
          # cannot drop a file into the image.
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: arc-control-data
      # Long enough for the SIGTERM handler to close the listener and flush.
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: arc-control-api
  namespace: arc-control
  labels:
    app.kubernetes.io/name: arc-control
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arc-control
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8787
      targetPort: http
