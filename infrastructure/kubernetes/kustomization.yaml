apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: arc-control

# secret.example.yaml is deliberately absent: it is an example, and applying
# it would deploy a placeholder operator token. Create the real secret out of
# band, or point at the cluster's secret manager.
resources:
  - namespace.yaml
  - storage.yaml
  - api.yaml
  - console.yaml
  - networkpolicy.yaml

commonLabels:
  app.kubernetes.io/part-of: arc-control
  app.kubernetes.io/version: 0.1.0

images:
  - name: ghcr.io/arc-transformation-group/arc-control
    newTag: 0.1.0
