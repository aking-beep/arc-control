apiVersion: v1
kind: Namespace
metadata:
  name: arc-control
  labels:
    app.kubernetes.io/name: arc-control
    app.kubernetes.io/part-of: arc-control
    # The control plane decides whether agent actions happen, so it should not
    # share a namespace with the agents it governs.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
