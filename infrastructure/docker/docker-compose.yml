# ARC Control — a single-node deployment.
#
# Enough for a pilot, a demonstration or an air-gapped install. The API and
# console are separate services because they have different exposure: the API
# is reached by agents, the console by humans.
#
# Before running:
#   cp .env.example .env
#
# Then either point ARC_OIDC_* at your identity provider, so operators sign in
# individually, or set ARC_OPERATOR_TOKEN for the shared-token fallback. With
# neither, the API still starts and still governs agents — but every operator
# endpoint refuses every request, so nobody can administer the deployment. It
# says so loudly on startup.
#
# Then:
#   docker compose -f infrastructure/docker/docker-compose.yml up --build

name: arc-control

services:
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    command: ["node", "apps/control-api/dist/main.js"]
    environment:
      ARC_HOST: 0.0.0.0
      ARC_PORT: "8787"
      ARC_DATA_DIR: /var/lib/arc-control
      # Single sign-on. Configure these and the shared token below stops being
      # accepted at all, so a deployment cannot quietly hold the door open
      # behind its own identity provider.
      ARC_OIDC_ISSUER: ${ARC_OIDC_ISSUER:-}
      ARC_OIDC_CLIENT_ID: ${ARC_OIDC_CLIENT_ID:-}
      ARC_OIDC_CLIENT_SECRET: ${ARC_OIDC_CLIENT_SECRET:-}
      ARC_OIDC_REDIRECT_URI: ${ARC_OIDC_REDIRECT_URI:-}
      ARC_OIDC_ROLE_CLAIM: ${ARC_OIDC_ROLE_CLAIM:-}
      ARC_OIDC_ROLE_MAP: ${ARC_OIDC_ROLE_MAP:-}
      ARC_SESSION_SECRET: ${ARC_SESSION_SECRET:-}
      ARC_SECURE_COOKIES: ${ARC_SECURE_COOKIES:-false}
      # The fallback, for a deployment with no provider yet. Set neither this
      # nor single sign-on and the operator endpoints refuse everything.
      ARC_OPERATOR_TOKEN: ${ARC_OPERATOR_TOKEN:-}
      ARC_CONSOLE_URL: ${ARC_CONSOLE_URL:-http://127.0.0.1:8788}
      ARC_SCHEDULE: ${ARC_SCHEDULE:-true}
      ARC_SEED_DEMO: ${ARC_SEED_DEMO:-false}
    ports:
      # Bound to loopback. Agents reach this through the compose network;
      # exposing it publicly is a deployment decision, not a default.
      - "127.0.0.1:8787:8787"
    volumes:
      - arc-data:/var/lib/arc-control
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

  console:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    command: ["node", "apps/control-console/dist/main.js"]
    environment:
      ARC_CONSOLE_HOST: 0.0.0.0
      ARC_CONSOLE_PORT: "8788"
      # Where the console reaches the API: a compose service name, resolvable
      # inside this network and nowhere else.
      ARC_API_BASE: http://api:8787
      # Where a browser reaches it, for the sign-in redirect. Not the same
      # address, which is the entire reason this variable exists.
      ARC_PUBLIC_API_BASE: ${ARC_PUBLIC_API_BASE:-http://127.0.0.1:8787}
      # Only for the shared-token fallback. With single sign-on the console
      # carries no credential of its own: it forwards the visitor's session,
      # and the identity on an approval is the one the API verified.
      ARC_OPERATOR_TOKEN: ${ARC_OPERATOR_TOKEN:-}
      ARC_OPERATOR_IDENTITY: ${ARC_OPERATOR_IDENTITY:-}
      ARC_OPERATOR_ROLES: ${ARC_OPERATOR_ROLES:-}
    ports:
      - "127.0.0.1:8788:8788"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

volumes:
  arc-data:
