name: Container image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'infrastructure/docker/**'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
      - 'connectors/**'
      - 'apps/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build${{ github.event_name == 'pull_request' && '' || ' and publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # On a pull request the image is built and thrown away: the point is to
      # catch a Dockerfile that no longer builds, not to publish from a branch.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # The image build runs the test and eval suites, so a published image is
      # one whose control-plane guarantees held at build time.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        if: github.event_name == 'pull_request'
        run: |
          docker build -t arc-control:smoke -f infrastructure/docker/Dockerfile .

          docker run -d --name arc-smoke \
            -e ARC_OPERATOR_TOKEN=smoke-token \
            -e ARC_SEED_DEMO=true \
            -p 8787:8787 \
            arc-control:smoke

          for attempt in $(seq 1 30); do
            if curl -fsS localhost:8787/health > /dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "--- health ---"
          curl -fsS localhost:8787/health

          # The agent key is printed once, at startup, and nowhere else.
          KEY=$(docker logs arc-smoke 2>&1 | awk '/finance-agent/ {print $2}')
          test -n "$KEY" || { echo "no agent key in the startup output"; docker logs arc-smoke; exit 1; }

          echo "--- the $4,200 refund must be denied ---"
          OUTCOME=$(curl -fsS localhost:8787/v1/actions \
            -H "authorization: Bearer $KEY" \
            -d '{"tool":"stripe.refund","parameters":{"customer":"customer_123","amount":4200}}' \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).outcome))')

          echo "outcome: $OUTCOME"
          test "$OUTCOME" = "denied" || { echo "expected denied"; exit 1; }

          echo "--- the audit chain must verify ---"
          curl -fsS localhost:8787/v1/audit/verify -H "authorization: Bearer smoke-token"

          echo "--- the deploy skill's smoke test, against the image ---"
          node tools/harness/deploy-smoke.mjs --base http://localhost:8787 --operator-token smoke-token --agent-key "$KEY"

          docker rm -f arc-smoke
