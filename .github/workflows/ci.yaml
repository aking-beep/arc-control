name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and evals
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # 22 is the minimum the engines field allows; 24 catches anything the
        # next LTS changes under us. There are no runtime dependencies, so the
        # only moving part is Node itself.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts skips the root `prepare` build, so the build step
      # below is the one whose output is reported.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Tests
        run: node --test "packages/*/dist/**/*.test.js" "connectors/*/dist/**/*.test.js" "apps/*/dist/**/*.test.js"

      # The evals assert the control plane's guarantees — a denied action never
      # reaches the target system, adding a policy can only tighten
      # authorization, one authorization means one effect. A break here is a
      # break in the product, not in a test.
      - name: Control-plane evals
        run: node evals/run.js

      - name: Examples
        run: |
          node examples/approval-required-agent/run.js
          node examples/protected-mcp-server/run.js

      # The console walkthrough drives the API and the console over HTTP and
      # asserts each of the nine steps, so it fails the build rather than
      # printing a transcript nobody reads.
      - name: Console walkthrough
        run: node examples/console-walkthrough/run.js

      # The showcase build crawls the rendered console and fails if any page
      # answers anything but 200 or if any link cannot be resolved to a
      # captured page. That makes it a link checker for the whole console, not
      # only a publishing step.
      - name: Static showcase builds with no dead links
        run: node tools/showcase/build.mjs --out "$RUNNER_TEMP/showcase"

      # The CLI is a user-facing binary: argument parsing, output and exit
      # codes are not covered by the unit tests, so a broken command would
      # ship silently. This drives the real binary against a real data
      # directory and checks the exit codes mean what the help text says.
      - name: CLI commands work against a real store
        env:
          ARC_OPERATOR_TOKEN: ci-operator-token
        run: |
          set -euo pipefail
          DATA="$RUNNER_TEMP/arc-data"

          ARC_PORT=8899 ARC_DATA_DIR="$DATA" ARC_SEED_DEMO=true \
            node apps/control-api/dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          API=$!
          trap 'kill $API 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            curl -sf -m 2 http://127.0.0.1:8899/health > /dev/null 2>&1 && break
            sleep 0.5
          done

          OP=(-H "authorization: Bearer $ARC_OPERATOR_TOKEN" -H 'x-arc-operator: ci@example.com' -H 'content-type: application/json')
          AGENT=$(awk '/finance-agent/ {print $2}' "$RUNNER_TEMP/api.log")

          # Real traffic: one allowed, one denied.
          curl -sf -XPOST http://127.0.0.1:8899/v1/actions \
            -H "authorization: Bearer $AGENT" -H 'content-type: application/json' \
            -d '{"tool":"stripe.refund","parameters":{"customer":"cus_ci","amount":120}}' > /dev/null
          curl -sf -XPOST http://127.0.0.1:8899/v1/actions \
            -H "authorization: Bearer $AGENT" -H 'content-type: application/json' \
            -d '{"tool":"stripe.refund","parameters":{"customer":"cus_ci","amount":99999}}' > /dev/null

          curl -sf -XPOST http://127.0.0.1:8899/v1/evidence/bundles "${OP[@]}" \
            -d '{"scope":{"kind":"window"}}' > "$RUNNER_TEMP/bundle.json"

          kill $API; wait $API 2>/dev/null || true

          node packages/cli/dist/bin.js assurance controls
          node packages/cli/dist/bin.js audit verify --data "$DATA"
          node packages/cli/dist/bin.js bundle verify "$RUNNER_TEMP/bundle.json"

          # The demo seed records no governance, so ARC-AI-001 fails and the
          # command must exit 1. An exit 0 here would mean the gate is inert.
          if node packages/cli/dist/bin.js assurance evaluate --data "$DATA"; then
            echo "::error::arc assurance evaluate exited 0 with a failing control"
            exit 1
          fi

          # Coverage reports gaps without failing: a gap is not a defect.
          node packages/cli/dist/bin.js assurance coverage --data "$DATA"

          # And a tampered bundle must exit 1.
          node -e '
            const fs = require("node:fs");
            const path = process.env.RUNNER_TEMP + "/bundle.json";
            const bundle = JSON.parse(fs.readFileSync(path, "utf8"));
            bundle.evidence[0].record.outcome = "rewritten";
            fs.writeFileSync(process.env.RUNNER_TEMP + "/tampered.json", JSON.stringify(bundle));
          '
          if node packages/cli/dist/bin.js bundle verify "$RUNNER_TEMP/tampered.json"; then
            echo "::error::arc bundle verify exited 0 on a tampered bundle"
            exit 1
          fi

  no-runtime-dependencies:
    name: No runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A control plane's supply chain is part of its threat model, so the
      # "zero runtime dependencies" claim in the README is enforced rather
      # than asserted. Workspace siblings are not third-party.
      - name: Assert every dependency is a workspace sibling
        run: node .github/scripts/check-dependencies.mjs

  infrastructure:
    name: Deployment artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The Terraform module, the Compose file and the Kubernetes manifests
      # are the one part of this repository the test suite cannot run — there
      # is no cluster here. Their failures are an undeclared variable or a
      # misspelled environment variable, which surface as "the feature does
      # nothing" in somebody else's cluster rather than as a red test.
      - name: Check the deployment artefacts against the code they configure
        run: node .github/scripts/check-infrastructure.mjs

  schemas:
    name: Published schemas
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse and check every published schema
        run: node .github/scripts/check-schemas.mjs

  policies:
    name: Lint the shipped policies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      # `arc policy lint` is what an operator runs before trusting a policy.
      # Running it here keeps the command working and the shipped policies
      # valid.
      - name: arc policy lint
        run: |
          node .github/scripts/export-demo-policies.mjs /tmp/demo-policies.json
          node packages/cli/dist/bin.js policy lint /tmp/demo-policies.json
